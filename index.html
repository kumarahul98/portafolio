<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Anti-FOUC: apply theme class before any paint so prerendered HTML shows correct theme -->
    <script>
      (function () {
        var saved = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <!-- Critical background: prevents white flash before Tailwind CSS file loads -->
    <style>
      html { background: #0c1a30 }
      html:not(.dark) { background: #ffffff }
    </style>
    <meta name="description" content="Rahul Kumar — Principal Solutions Architect at AntStack. Builds scalable cloud-native solutions on AWS. Serverless, DevOps, GenAI." />
    <meta name="keywords" content="Rahul Kumar, Principal Solutions Architect, AntStack, AWS, Serverless, DevOps, GenAI, Databricks, Full Stack Developer" />
    <meta name="author" content="Rahul Kumar" />
    <title>Rahul Kumar — Principal Solutions Architect</title>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.rahulkmr.com/" />
    <meta property="og:title" content="Rahul Kumar — Principal Solutions Architect" />
    <meta property="og:description" content="Builds scalable cloud-native solutions on AWS. Serverless, DevOps, GenAI." />
    <meta property="og:image" content="https://www.rahulkmr.com/profile.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://www.rahulkmr.com/" />
    <meta property="twitter:title" content="Rahul Kumar — Principal Solutions Architect" />
    <meta property="twitter:description" content="Builds scalable cloud-native solutions on AWS. Serverless, DevOps, GenAI." />
    <meta property="twitter:image" content="https://www.rahulkmr.com/profile.jpg" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#162C5A" />
    <link rel="canonical" href="https://www.rahulkmr.com/" />
    <link
      rel="preload"
      as="image"
      href="/hero/hero-960.webp"
      imagesrcset="/hero/hero-960.webp 960w, /hero/hero-1600.webp 1600w, /hero/hero-2200.webp 2200w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Rahul Kumar",
        "url": "https://www.rahulkmr.com",
        "jobTitle": "Principal Solutions Architect",
        "worksFor": {
          "@type": "Organization",
          "name": "AntStack Technologies"
        },
        "sameAs": [
          "https://www.linkedin.com/in/kumarahul98/",
          "https://x.com/coolman9633",
          "https://github.com/kumarahul98"
        ]
      }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=Press+Start+2P&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=Press+Start+2P&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=Press+Start+2P&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Google tag (gtag.js) -->
    <script>
      window.addEventListener('load', () => {
        const script = document.createElement('script');
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-W84E4MXNXC';
        script.async = true;
        document.head.appendChild(script);

        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', 'G-W84E4MXNXC');
      }, { once: true });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
