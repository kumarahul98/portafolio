<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Anti-FOUC: apply theme class before any paint so prerendered HTML shows correct theme -->
    <script>
      (function () {
        var saved = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <script>
      window.__portfolioFontsLoaded = function () {
        document.documentElement.classList.add('fonts-loaded');
      };
    </script>
    <!-- Critical background: prevents white flash before Tailwind CSS file loads -->
    <style>
      html { background: #0c1a30 }
      html:not(.dark) { background: #ffffff }

      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        transition: opacity 0.32s ease, visibility 0.32s ease;
      }

      html:not(.dark) #app-loader {
        color: #162c5a;
      }

      #app-loader.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .app-loader__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        padding: 24px 28px;
      }

      .app-loader__brain {
        --brain-progress: 0%;
        width: 88px;
        height: 88px;
        animation: brain-float 1.7s ease-in-out infinite;
        filter: drop-shadow(0 14px 28px rgba(92, 141, 242, 0.2));
      }

      .app-loader__brain svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .app-loader__brain-outline {
        opacity: 0.9;
      }

      .app-loader__brain-fill {
        transform-box: fill-box;
        transform-origin: center bottom;
        transform: scaleY(calc(var(--brain-progress) / 100));
        transition: transform 0.52s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .app-loader__dots {
        display: inline-flex;
        gap: 6px;
        margin-left: 8px;
      }

      .app-loader__dots span {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: currentColor;
        opacity: 0.25;
        animation: dot-pulse 0.9s ease-in-out infinite;
      }

      .app-loader__dots span:nth-child(2) {
        animation-delay: 0.15s;
      }

      .app-loader__dots span:nth-child(3) {
        animation-delay: 0.3s;
      }

      .app-loader__text {
        display: flex;
        align-items: center;
        font: 600 14px/1.2 var(--font-sans, ui-sans-serif, system-ui, sans-serif);
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      @keyframes brain-float {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-7px) scale(1.03); }
      }

      @keyframes dot-pulse {
        0%, 100% { opacity: 0.22; transform: translateY(0); }
        50% { opacity: 1; transform: translateY(-2px); }
      }
    </style>
    <meta name="description" content="Rahul Kumar — Principal Solutions Architect at AntStack. Builds scalable cloud-native solutions on AWS. Serverless, DevOps, GenAI." />
    <meta name="keywords" content="Rahul Kumar, Principal Solutions Architect, AntStack, AWS, Serverless, DevOps, GenAI, Databricks, Full Stack Developer" />
    <meta name="author" content="Rahul Kumar" />
    <title>Rahul Kumar — Principal Solutions Architect</title>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.rahulkmr.com" />
    <meta property="og:title" content="Rahul Kumar — Principal Solutions Architect" />
    <meta property="og:description" content="Builds scalable cloud-native solutions on AWS. Serverless, DevOps, GenAI." />
    <meta property="og:image" content="https://www.rahulkmr.com" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://www.rahulkmr.com/" />
    <meta property="twitter:title" content="Rahul Kumar — Principal Solutions Architect" />
    <meta property="twitter:description" content="Builds scalable cloud-native solutions on AWS. Serverless, DevOps, GenAI." />
    <meta property="twitter:image" content="https://www.rahulkmr.com/profile.jpg" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#162C5A" />
    <link rel="canonical" href="https://www.rahulkmr.com/" />
    <link
      rel="preload"
      as="image"
      href="/hero/hero-960.webp"
      imagesrcset="/hero/hero-960.webp 960w, /hero/hero-1600.webp 1600w, /hero/hero-2200.webp 2200w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Rahul Kumar",
        "url": "https://www.rahulkmr.com",
        "jobTitle": "Principal Solutions Architect",
        "worksFor": {
          "@type": "Organization",
          "name": "AntStack Technologies"
        },
        "sameAs": [
          "https://www.linkedin.com/in/kumarahul98/",
          "https://x.com/coolman9633",
          "https://github.com/kumarahul98"
        ]
      }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=Press+Start+2P&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=Press+Start+2P&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all';window.__portfolioFontsLoaded && window.__portfolioFontsLoaded()"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=Press+Start+2P&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Google tag (gtag.js) — loaded after first user interaction to reduce unused JS on initial load -->
    <script>
      (function () {
        var loaded = false;
        function loadGtag() {
          if (loaded) return;
          loaded = true;
          var script = document.createElement('script');
          script.src = 'https://www.googletagmanager.com/gtag/js?id=G-W84E4MXNXC';
          script.async = true;
          document.head.appendChild(script);
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          window.gtag = gtag;
          gtag('js', new Date());
          gtag('config', 'G-W84E4MXNXC');
        }
        ['scroll', 'click', 'keydown', 'touchstart', 'mousemove'].forEach(function(evt) {
          window.addEventListener(evt, loadGtag, { once: true, passive: true });
        });
        // Fallback: load after 5s even with no interaction
        setTimeout(loadGtag, 5000);
      })();
    </script>
  </head>
  <body>
    <div id="app-loader" aria-live="polite" aria-label="Loading">
      <div class="app-loader__inner">
        <div class="app-loader__brain" aria-hidden="true">
          <svg viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <clipPath id="brain-shape">
                <path d="M35 18c-9.4 0-17 7.6-17 17 0 2.1.4 4.1 1.1 6A15 15 0 0 0 20 70c4 5 10.1 8 16.5 8H48V18H35Z"/>
                <path d="M61 18c9.4 0 17 7.6 17 17 0 2.1-.4 4.1-1.1 6A15 15 0 0 1 76 70c-4 5-10.1 8-16.5 8H48V18h13Z"/>
              </clipPath>
              <linearGradient id="brain-fill-gradient" x1="20" y1="78" x2="76" y2="18" gradientUnits="userSpaceOnUse">
                <stop stop-color="#5C8DF2"/>
                <stop offset="1" stop-color="#D51B1C"/>
              </linearGradient>
            </defs>
            <g clip-path="url(#brain-shape)" class="app-loader__brain-fill">
              <rect x="12" y="10" width="72" height="70" fill="url(#brain-fill-gradient)"/>
            </g>
            <g class="app-loader__brain-outline">
              <path d="M35 18c-9.4 0-17 7.6-17 17 0 2.1.4 4.1 1.1 6A15 15 0 0 0 20 70c4 5 10.1 8 16.5 8H48V18H35Z" stroke="currentColor" stroke-width="4"/>
              <path d="M61 18c9.4 0 17 7.6 17 17 0 2.1-.4 4.1-1.1 6A15 15 0 0 1 76 70c-4 5-10.1 8-16.5 8H48V18h13Z" stroke="currentColor" stroke-width="4"/>
              <path d="M34 31c4 0 7 3 7 7m-14 0c0-4 3-7 7-7m2 19c3.3 0 6 2.7 6 6m-12 0c0-3.3 2.7-6 6-6m24-19c-4 0-7 3-7 7m14 0c0-4-3-7-7-7m-2 19c-3.3 0-6 2.7-6 6m12 0c0-3.3-2.7-6-6-6" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
              <path d="M48 24v50" stroke="currentColor" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
            </g>
          </svg>
        </div>
        <div class="app-loader__text">
          Thinking
          <span class="app-loader__dots" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
